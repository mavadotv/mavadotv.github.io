  <script>
    /* Converte links antigos (ex.: /melee, /atlas, /buildsd4) para as novas rotas
       e funciona tanto na raiz do domínio quanto em subpasta (GitHub Pages /repo/). */
    (function () {
      var map = {
        poe1: "poe1", builds: "poe1/builds", buildmavado: "poe1/builds", "laboratorio-de-builds": "poe1/builds/lab",
        melee: "poe1/builds/melee", spell: "poe1/builds/spell", mine: "poe1/builds/mine", projectile: "poe1/builds/projectile",
        minion: "poe1/builds/minion", totem: "poe1/builds/totem", atlas: "poe1/atlas", atlasinicial: "poe1/atlas/inicial",
        earlygame: "poe1/atlas/early", midgame: "poe1/atlas/mid", endgame: "poe1/atlas/end", "genesis-tree": "poe1/genesis",
        utilitarios: "poe1/utilitarios", craft: "poe1/craft", diablo4: "d4", buildsd4: "d4/builds", runeword: "d4/runewords",
        poe2: "poe2", hellclock: "hellclock"
      };
      var parts = location.pathname.replace(/\/+$/, "").split("/");
      var slug = (parts.pop() || "").toLowerCase().replace(/\.html?$/, "");
      var base = parts.join("/") + "/";
      location.replace(base + "#/" + (map[slug] || "404"));
    })();
  </script>
