# Publica o site no GitHub Pages a cada push na branch main.
# Em Settings > Pages, selecione "Source: GitHub Actions".
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publica só o site: o editor local e os atalhos ficam de fora
      - name: Montar a pasta do site
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '.claude' --exclude '_site' \
            --exclude 'editor' --exclude 'editar-site.*' --exclude 'README.md' \
            --exclude 'netlify.toml' --exclude 'vercel.json' --exclude '.gitignore'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
