<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="editor-token" content="__EDITOR_TOKEN__" />
  <meta name="robots" content="noindex" />
  <title>Editor do site | Mavado_TV</title>
  <link rel="icon" href="/assets/img/brand/favicon-64.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/editor/editor.css" />
</head>
<body>
  <header class="bar">
    <button class="icon-btn only-mobile" id="menuBtn" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="side">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="bar__brand" href="/" target="_blank" rel="noopener" title="Abrir o site em outra aba">
      <img src="/assets/img/brand/logo.webp" alt="" />
      <span>Editor</span>
    </a>
    <span class="state" id="state" data-state="saved"><i></i><span>Tudo salvo</span></span>
    <div class="bar__actions">
      <button class="btn btn--ghost" id="undoBtn" type="button" title="Desfazer (Ctrl+Z)" disabled>
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span class="hide-sm">Desfazer</span>
      </button>
      <button class="btn btn--ghost only-mobile" id="previewBtn" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="hide-sm">Prévia</span>
      </button>
      <button class="btn" id="saveBtn" type="button" title="Salvar (Ctrl+S)" disabled>
        <svg viewBox="0 0 24 24"><path d="M5 3h11l4 4v14H4V3z"/><path d="M8 3v5h8M8 21v-7h8v7"/></svg><span>Salvar</span>
      </button>
      <button class="btn btn--publish" id="publishBtn" type="button">
        <svg viewBox="0 0 24 24"><path d="M12 16V4M6 10l6-6 6 6"/><path d="M4 20h16"/></svg><span>Publicar</span>
      </button>
    </div>
  </header>

  <div class="layout">
    <aside class="side" id="side" aria-label="Seções do site">
      <nav id="tree"></nav>
      <div class="side__foot">
        <a href="/" target="_blank" rel="noopener">Abrir o site ↗</a>
        <button type="button" id="helpBtn">Como funciona?</button>
      </div>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <main class="editor" id="editor" tabindex="-1">
      <div class="loading">Carregando conteúdo…</div>
    </main>

    <section class="preview" id="preview" aria-label="Pré-visualização">
      <div class="preview__bar">
        <span class="preview__title">Pré-visualização</span>
        <div class="seg" role="group" aria-label="Tamanho da tela">
          <button type="button" data-size="desktop" aria-pressed="true" title="Computador">
            <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </button>
          <button type="button" data-size="mobile" aria-pressed="false" title="Celular">
            <svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
          </button>
        </div>
        <button class="icon-btn" type="button" id="reloadPreview" title="Recarregar prévia">
          <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
        </button>
      </div>
      <div class="preview__stage" id="stage">
        <iframe id="frame" title="Pré-visualização do site" src="/preview?preview=1#/"></iframe>
      </div>
    </section>
  </div>

  <!-- Modal genérico -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <header class="modal__head">
        <h2 id="modalTitle"></h2>
        <button class="icon-btn" type="button" data-close aria-label="Fechar">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div class="modal__body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <input type="file" id="fileInput" accept="image/png,image/jpeg,image/webp,image/gif" hidden />

  <script src="/editor/editor.js"></script>
</body>
</html>
